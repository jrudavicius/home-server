# Reconcile the existing server by name. Its keys are stored separately in info.
[[server]]
name = "home-server"
description = "Raspberry Pi Docker host with operational health alerts."
tags = ["home", "operations"]

[server.config]
enabled = true
stats_monitoring = true
send_unreachable_alerts = true
send_disk_alerts = true
send_cpu_alerts = true
send_mem_alerts = true
send_version_mismatch_alerts = true
disk_warning = 80.0
disk_critical = 90.0
