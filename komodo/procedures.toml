[[procedure]]
name = "home-server-deploy"
description = "Sync configuration, then deploy changed Stacks in dependency order."
tags = ["home"]

[procedure.config]
webhook_enabled = true
failure_alert = true

# Stages are sequential and stop on failure. Keep one execution per stage so
# deployments using the shared Repo cannot overlap. Update this Procedure via
# a manual Resource Sync while it is idle before running a changed definition.
[[procedure.config.stage]]
name = "Sync resource definitions"
executions = [
  { execution.type = "RunSync", execution.params.sync = "home-server-resources" },
]

[[procedure.config.stage]]
name = "Deploy entrypoint"
executions = [
  { execution.type = "DeployStackIfChanged", execution.params.stack = "entrypoint" },
]

[[procedure.config.stage]]
name = "Deploy observability"
executions = [
  { execution.type = "DeployStackIfChanged", execution.params.stack = "observability" },
]

[[procedure.config.stage]]
name = "Deploy media"
executions = [
  { execution.type = "DeployStackIfChanged", execution.params.stack = "media" },
]

# Keep the webhook tunnel available until the other deployments finish.
[[procedure.config.stage]]
name = "Deploy public access"
executions = [
  { execution.type = "DeployStackIfChanged", execution.params.stack = "public-access" },
]

# Reconcile Komodo's built-in procedure by name instead of scheduling a duplicate.
[[procedure]]
name = "Backup Core Database"
description = "Back up Komodo daily; retain the configured number of local snapshots."
tags = ["system", "home"]

[procedure.config]
schedule = "Every day at 01:00"
schedule_timezone = "Europe/Vilnius"
schedule_enabled = true
schedule_alert = false
failure_alert = true
webhook_enabled = false

[[procedure.config.stage]]
name = "Back up Komodo database"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true },
]
