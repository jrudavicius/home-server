[[stack]]
name = "entrypoint"
description = "Traefik reverse proxy and local home server landing page."
tags = ["entrypoint", "home"]
deploy = true

[stack.config]
server = "home-server"
files_on_host = false
git_provider = "github.com"
git_https = true
repo = "jrudavicius/home-server"
branch = "main"
run_directory = "stacks/entrypoint"
file_paths = ["docker-compose.yml"]
config_files = [
  { path = "traefik/dynamic.yml", services = ["reverse-proxy"], requires = "None" },
  { path = "entrypoint/index.html.template", services = ["landing-page"], requires = "Restart" },
]
project_name = "entrypoint"
auto_pull = true
webhook_enabled = true
webhook_force_deploy = true
environment = """
TRAEFIK_HTTP_PORT=80
TRAEFIK_DASHBOARD_HOST=traefik.home.arpa
TRAEFIK_LOG_LEVEL=INFO

ENTRYPOINT_TITLE=Home Server
ENTRYPOINT_SUBTITLE=Raspberry Pi services
ENTRYPOINT_KOMODO_URL=
ENTRYPOINT_PLEX_URL=
ENTRYPOINT_GRAFANA_URL=
ENTRYPOINT_TRAEFIK_URL=
ENTRYPOINT_NGROK_URL=
ENTRYPOINT_TRANSMISSION_URL=

GRAFANA_PORT=3000
GRAFANA_TRAEFIK_HOST=grafana.home.arpa
KOMODO_PORT=9120
KOMODO_TRAEFIK_HOST=komodo.home.arpa
NGROK_INSPECT_PORT=[[NGROK_INSPECT_PORT]]
PLEX_PORT=32400
PLEX_TRAEFIK_HOST=plex.home.arpa
TRANSMISSION_WEB_PORT=9091
TRANSMISSION_TRAEFIK_HOST=transmission.home.arpa
"""

[[stack]]
name = "observability"
description = "Grafana dashboards and log alerts, with Loki and Alloy for Docker logs."
tags = ["observability", "logs", "home"]
deploy = true
after = ["entrypoint"]

[stack.config]
server = "home-server"
files_on_host = false
git_provider = "github.com"
git_https = true
repo = "jrudavicius/home-server"
branch = "main"
run_directory = "stacks/observability"
file_paths = ["docker-compose.yml"]
config_files = [
  { path = "alloy/config.alloy", services = ["log-collector"], requires = "Restart" },
  { path = "loki/loki.yml", services = ["log-store"], requires = "Restart" },
  { path = "grafana/provisioning/datasources/loki.yml", services = ["log-dashboard"], requires = "Restart" },
  { path = "grafana/provisioning/dashboards/docker-logs.yml", services = ["log-dashboard"], requires = "Restart" },
  { path = "grafana/provisioning/alerting/docker-alerts.json", services = ["log-dashboard"], requires = "Restart" },
  { path = "grafana/dashboards/home-server-overview.json", services = ["log-dashboard"], requires = "Restart" },
  { path = "grafana/dashboards/docker-logs.json", services = ["log-dashboard"], requires = "Restart" },
]
project_name = "observability"
auto_pull = true
webhook_enabled = true
webhook_force_deploy = true
environment = """
GRAFANA_IMAGE_TAG=13.1.0
LOKI_IMAGE_TAG=3.7.0
ALLOY_IMAGE_TAG=v1.17.0

GRAFANA_PORT=3000
GRAFANA_TRAEFIK_HOST=grafana.home.arpa
GRAFANA_ROOT_URL=http://grafana.home.arpa/
GRAFANA_ADMIN_USER=admin
GRAFANA_ADMIN_PASSWORD=[[GRAFANA_ADMIN_PASSWORD]]
GRAFANA_PLUGINS_PREINSTALL_DISABLED=true
GRAFANA_PLUGINS_PREINSTALL_AUTO_UPDATE=false

LOKI_RETENTION_PERIOD=168h
LOKI_MAX_QUERY_LOOKBACK=168h

DOCKER_SOCKET_PATH=/var/run/docker.sock
"""

[[stack]]
name = "media"
description = "Plex on normal internet; Transmission routed through MikroTik's Proton VPN."
tags = ["media-services", "vpn", "home"]
deploy = true
after = ["entrypoint"]

[stack.config]
server = "home-server"
files_on_host = false
git_provider = "github.com"
git_https = true
repo = "jrudavicius/home-server"
branch = "main"
run_directory = "stacks/media"
file_paths = ["docker-compose.yml"]
project_name = "media"
auto_pull = true
webhook_enabled = true
webhook_force_deploy = true
environment = """
PLEX_PORT=32400
PLEX_TRAEFIK_HOST=plex.home.arpa
PLEX_CLAIM=
PLEX_CONFIG_PATH=[[PLEX_CONFIG_PATH]]
TRANSCODE_PATH=[[TRANSCODE_PATH]]
MEDIA_PATH=[[MEDIA_PATH]]

TRANSMISSION_LAN_IP=[[TRANSMISSION_LAN_IP]]
TRANSMISSION_LAN_MAC=[[TRANSMISSION_LAN_MAC]]
TRANSMISSION_DNS=[[TRANSMISSION_DNS]]

TRANSMISSION_PEER_PORT=51413
TRANSMISSION_TRAEFIK_HOST=transmission.home.arpa
TRANSMISSION_USERNAME=julius
TRANSMISSION_CONFIG_PATH=[[TRANSMISSION_CONFIG_PATH]]
TRANSMISSION_USER_PASSWORD_FILE=[[TRANSMISSION_USER_PASSWORD_FILE]]
"""

[[stack]]
name = "public-access"
description = "Public tunnel for external entrypoint access and GitHub webhook delivery, provided by ngrok."
tags = ["network", "webhooks", "home"]
deploy = true
after = ["entrypoint"]

[stack.config]
server = "home-server"
files_on_host = false
git_provider = "github.com"
git_https = true
repo = "jrudavicius/home-server"
branch = "main"
run_directory = "stacks/public-access"
file_paths = ["docker-compose.yml"]
config_files = [
  { path = "ngrok.yml", services = ["tunnel"], requires = "Restart" },
]
project_name = "public-access"
auto_pull = true
webhook_enabled = true
webhook_force_deploy = true
environment = """
NGROK_AUTHTOKEN=[[NGROK_AUTHTOKEN]]
NGROK_INSPECT_PORT=[[NGROK_INSPECT_PORT]]
NGROK_DOCKER_NETWORK=[[NGROK_DOCKER_NETWORK]]
"""
