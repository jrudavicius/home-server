http:
  routers:
    reverse-proxy:
      rule: 'Host(`{{ env "TRAEFIK_DASHBOARD_HOST" | default "traefik.home.arpa" }}`) || PathPrefix(`/api`) || PathPrefix(`/dashboard`)'
      entryPoints:
        - web
      priority: 20
      service: api@internal

    control-plane:
      rule: 'Host(`{{ env "KOMODO_TRAEFIK_HOST" | default "komodo.home.arpa" }}`) || PathPrefix(`/listener`)'
      entryPoints:
        - web
      priority: 30
      service: control-plane

    streaming-server:
      rule: 'Host(`{{ env "PLEX_TRAEFIK_HOST" | default "plex.home.arpa" }}`)'
      entryPoints:
        - web
      priority: 20
      service: streaming-server

    log-dashboard:
      rule: 'Host(`{{ env "GRAFANA_TRAEFIK_HOST" | default "grafana.home.arpa" }}`)'
      entryPoints:
        - web
      priority: 20
      service: log-dashboard

    torrent-client:
      rule: 'Host(`{{ env "TRANSMISSION_TRAEFIK_HOST" | default "transmission.home.arpa" }}`)'
      entryPoints:
        - web
      priority: 20
      service: torrent-client

    torrent-client-direct:
      rule: 'PathPrefix(`/`)'
      entryPoints:
        - torrent-client
      service: torrent-client

    landing-page:
      rule: 'PathPrefix(`/`)'
      entryPoints:
        - web
      priority: 1
      service: landing-page

  services:
    control-plane:
      loadBalancer:
        servers:
          - url: "http://management-control-plane:9120"

    streaming-server:
      loadBalancer:
        servers:
          - url: "http://media-streaming-server:32400"

    log-dashboard:
      loadBalancer:
        servers:
          - url: "http://observability-log-dashboard:3000"

    torrent-client:
      loadBalancer:
        servers:
          - url: "http://media-torrent-client:9091"

    landing-page:
      loadBalancer:
        servers:
          - url: "http://entrypoint-landing-page:80"
