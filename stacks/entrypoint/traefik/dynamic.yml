http:
  routers:
    traefik:
      rule: 'Host(`{{ env "TRAEFIK_DASHBOARD_HOST" | default "traefik.home.arpa" }}`) || PathPrefix(`/api`) || PathPrefix(`/dashboard`)'
      entryPoints:
        - web
      priority: 20
      service: api@internal

    komodo:
      rule: 'Host(`{{ env "KOMODO_TRAEFIK_HOST" | default "komodo.home.arpa" }}`) || PathPrefix(`/listener`)'
      entryPoints:
        - web
      priority: 30
      service: komodo

    plex:
      rule: 'Host(`{{ env "PLEX_TRAEFIK_HOST" | default "plex.home.arpa" }}`)'
      entryPoints:
        - web
      priority: 20
      service: plex

    grafana:
      rule: 'Host(`{{ env "GRAFANA_TRAEFIK_HOST" | default "grafana.home.arpa" }}`)'
      entryPoints:
        - web
      priority: 20
      service: grafana

    transmission:
      rule: 'Host(`{{ env "TRANSMISSION_TRAEFIK_HOST" | default "transmission.home.arpa" }}`)'
      entryPoints:
        - web
      priority: 20
      service: transmission

    transmission-direct:
      rule: 'PathPrefix(`/`)'
      entryPoints:
        - transmission
      service: transmission

    entrypoint:
      rule: 'PathPrefix(`/`)'
      entryPoints:
        - web
      priority: 1
      service: entrypoint

  services:
    komodo:
      loadBalancer:
        servers:
          - url: "http://komodo-core:9120"

    plex:
      loadBalancer:
        servers:
          - url: "http://media-server:32400"

    grafana:
      loadBalancer:
        servers:
          - url: "http://observability-grafana:3000"

    transmission:
      loadBalancer:
        servers:
          - url: "http://torrent-client:9091"

    entrypoint:
      loadBalancer:
        servers:
          - url: "http://home-server-entrypoint:80"
