name: media

services:
  streaming-server:
    container_name: media-streaming-server
    image: plexinc/pms-docker:1.42.2.10156-f737b826c@sha256:9c03c26b9479ba9a09935f3367459bfdc8d21545f42ed2a13258983c5be1b252
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.streaming-server.rule: "Host(`${PLEX_TRAEFIK_HOST:-plex.home.arpa}`)"
      traefik.http.routers.streaming-server.entrypoints: web
      traefik.http.routers.streaming-server.priority: "20"
      traefik.http.services.streaming-server.loadbalancer.server.port: "32400"
    ports:
      - "${PLEX_PORT:?Set PLEX_PORT}:32400"
    environment:
      - PLEX_UID=1000
      - PLEX_GID=1000
      - TZ=Europe/Vilnius
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - "${PLEX_CONFIG_PATH:?Set PLEX_CONFIG_PATH}:/config"
      - "${TRANSCODE_PATH:?Set TRANSCODE_PATH}:/transcode"
      - "${MEDIA_PATH:?Set MEDIA_PATH}:/data"

  torrent-client:
    container_name: media-torrent-client
    image: lscr.io/linuxserver/transmission:4.0.6@sha256:452310cb020c036d293e879698097acb6cc653db2676610bf8e3b58a3f4d2af5
    restart: unless-stopped
    # Dedicated IP/MAC guards supplement MikroTik's whole-home Proton policy.
    # Never attach Transmission to the ordinary portainer_network.
    networks:
      transmission_lan:
        ipv4_address: ${TRANSMISSION_LAN_IP:?Set the router-protected TRANSMISSION_LAN_IP}
        mac_address: ${TRANSMISSION_LAN_MAC:?Set the router-protected TRANSMISSION_LAN_MAC}
        gw_priority: 1
      transmission_ui: {}
    dns:
      - ${TRANSMISSION_DNS:?Set TRANSMISSION_DNS to the Proton tunnel DNS address}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    labels:
      traefik.enable: "true"
      traefik.http.routers.torrent-client.rule: "Host(`${TRANSMISSION_TRAEFIK_HOST:-transmission.home.arpa}`)"
      traefik.http.routers.torrent-client.entrypoints: web
      traefik.http.routers.torrent-client.priority: "20"
      traefik.http.services.torrent-client.loadbalancer.server.port: "9091"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vilnius
      - USER=${TRANSMISSION_USERNAME:?Set TRANSMISSION_USERNAME}
      - FILE__PASS=/run/secrets/transmission_user_password
      - PEERPORT=${TRANSMISSION_PEER_PORT:-51413}
    volumes:
      - "${TRANSMISSION_CONFIG_PATH:?Set TRANSMISSION_CONFIG_PATH}:/config"
      - "${MEDIA_PATH:?Set MEDIA_PATH}:/media"
      - "${MEDIA_PATH:?Set MEDIA_PATH}/watch:/watch"
    secrets:
      - transmission_user_password

secrets:
  transmission_user_password:
    file: ${TRANSMISSION_USER_PASSWORD_FILE:?Set TRANSMISSION_USER_PASSWORD_FILE}

networks:
  default:
    external: true
    name: portainer_network
  # Provisioned on the Pi after its router policy; see router/README.md.
  transmission_lan:
    external: true
    name: transmission_lan
  # Internal bridge owned by the entrypoint stack, with no internet gateway.
  transmission_ui:
    external: true
    name: transmission_ui
