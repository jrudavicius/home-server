version: 3
# Historical public-access alternative; not used by the portable private setup.
# Enabling entrypoint exposes the landing page and routed services publicly.

agent:
  log: stdout
  log_format: term
  web_addr: 0.0.0.0:4040

endpoints:
  - name: webhooks
    url: https://your-webhooks-domain.ngrok.app
    description: Restricted GitHub webhook delivery.
    upstream:
      url: http://entrypoint-reverse-proxy:9121

  - name: entrypoint
    url: https://your-entrypoint-domain.ngrok.app
    description: Traefik entrypoint for the public landing page and routed services.
    upstream:
      url: http://entrypoint-reverse-proxy:80
