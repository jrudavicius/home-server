name: observability

services:
  log-store:
    container_name: observability-log-store
    image: grafana/loki:3.7.0@sha256:c316b7c7589a5eeca843b6926c7446149d18300b79ac8538dc4ae063bc478da2
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
      LOKI_MAX_QUERY_LOOKBACK: ${LOKI_MAX_QUERY_LOOKBACK:-168h}
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  log-collector:
    container_name: observability-log-collector
    image: grafana/alloy:v1.17.0@sha256:41c41849989b7e054ccbadc17938ee1e5592fe26bfbc56ef3ffc109c0b0b2739
    restart: unless-stopped
    depends_on:
      - log-store
    command:
      - run
      - --disable-reporting
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro"

  log-dashboard:
    container_name: observability-log-dashboard
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    restart: unless-stopped
    depends_on:
      - log-store
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://grafana.home.arpa/}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Vilnius
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/home-server-overview.json
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GRAFANA_ALERT_RECEIVER: empty
      GF_PLUGINS_PREINSTALL_DISABLED: ${GRAFANA_PLUGINS_PREINSTALL_DISABLED:-true}
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: ${GRAFANA_PLUGINS_PREINSTALL_AUTO_UPDATE:-false}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting/docker-alerts.json:/etc/grafana/provisioning/alerting/docker-alerts.json:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

networks:
  default:
    external: true
    name: portainer_network

volumes:
  alloy-data:
  grafana-data:
  loki-data:
