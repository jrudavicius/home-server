name: management

# Update Core and Periphery to the same release together, including both digests.
# All image pins are maintained in Git; see README.md: Image versions and updates.
services:
  secret-bootstrap:
    container_name: management-secret-bootstrap
    image: python:3.13.16-alpine3.24@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    restart: "no"
    network_mode: none
    read_only: true
    labels:
      komodo.skip: "true"
    command: ["python", "-B", "/scripts/render_komodo_secrets.py"]
    environment:
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in bootstrap.env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in bootstrap.env}
      TRANSMISSION_USERNAME: ${TRANSMISSION_USERNAME:?Set TRANSMISSION_USERNAME in bootstrap.env}
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in bootstrap.env}
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    volumes:
      - ./scripts/render_komodo_secrets.py:/scripts/render_komodo_secrets.py:ro
      - komodo-bootstrap-config:/bootstrap

  database:
    container_name: management-database
    image: mongo:8.0.34@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    restart: unless-stopped
    command: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    labels:
      komodo.skip: "true"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:?Set KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?Set KOMODO_DATABASE_PASSWORD}
    volumes:
      - komodo-mongo-data:/data/db
      - komodo-mongo-config:/data/configdb

  control-plane:
    container_name: management-control-plane
    image: ghcr.io/moghtech/komodo-core:2.3.3@sha256:bca73d0eee143066228fb9b80c38a5a2726e573ad2758f7aa92b5c91a8aef1c7
    init: true
    restart: unless-stopped
    depends_on:
      database:
        condition: service_started
      secret-bootstrap:
        condition: service_completed_successfully
        restart: true
    labels:
      traefik.enable: "true"
      traefik.http.routers.control-plane.rule: "Host(`${KOMODO_TRAEFIK_HOST:-komodo.home.arpa}`)"
      traefik.http.routers.control-plane.entrypoints: web
      traefik.http.routers.control-plane.priority: "20"
      traefik.http.services.control-plane.loadbalancer.server.port: "9120"
    ports:
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${KOMODO_PORT:?Set KOMODO_PORT}:9120"
    environment:
      TZ: Europe/Vilnius
      KOMODO_CONFIG_PATH: /config/bootstrap/core.config.json
      KOMODO_DATABASE_ADDRESS: database:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME:?Set KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?Set KOMODO_DATABASE_PASSWORD}
      KOMODO_HOST: ${KOMODO_HOST:?Set KOMODO_HOST}
      KOMODO_WEBHOOK_BASE_URL: ${KOMODO_WEBHOOK_BASE_URL:-}
      KOMODO_TITLE: Komodo
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
      KOMODO_LOCAL_AUTH: true
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME:?Set KOMODO_INIT_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD:?Set KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_FIRST_SERVER_NAME: ${KOMODO_FIRST_SERVER_NAME:?Set KOMODO_FIRST_SERVER_NAME}
      KOMODO_DISABLE_CONFIRM_DIALOG: false
      KOMODO_DISABLE_INIT_RESOURCES: false
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET:?Set KOMODO_WEBHOOK_SECRET}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET:?Set KOMODO_JWT_SECRET}
      KOMODO_JWT_TTL: 1-day
      KOMODO_MONITORING_INTERVAL: 15-sec
      KOMODO_RESOURCE_POLL_INTERVAL: 1-hr
      KOMODO_DISABLE_USER_REGISTRATION: true
      KOMODO_ENABLE_NEW_USERS: false
      KOMODO_DISABLE_NON_ADMIN_CREATE: false
      KOMODO_TRANSPARENT_MODE: false
      KOMODO_OIDC_ENABLED: false
      KOMODO_GITHUB_OAUTH_ENABLED: false
      KOMODO_GOOGLE_OAUTH_ENABLED: false
      KOMODO_LOGGING_PRETTY: false
      KOMODO_PRETTY_STARTUP_CONFIG: false
    volumes:
      - komodo-keys:/config/keys
      - komodo-bootstrap-config:/config/bootstrap:ro
      - "${KOMODO_BACKUPS_PATH:?Set KOMODO_BACKUPS_PATH}:/backups"

  host-agent:
    container_name: management-host-agent
    image: ghcr.io/moghtech/komodo-periphery:2.3.3@sha256:fa3f1a641a265216066676950d5eecdf506955a7bafe2f01996135ae93115cd5
    init: true
    restart: unless-stopped
    depends_on:
      - control-plane
    environment:
      TZ: Europe/Vilnius
      PERIPHERY_CORE_ADDRESS: ws://control-plane:9120
      PERIPHERY_CONNECT_AS: ${KOMODO_FIRST_SERVER_NAME:?Set KOMODO_FIRST_SERVER_NAME}
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: ${PERIPHERY_ROOT_DIRECTORY:?Set PERIPHERY_ROOT_DIRECTORY}
      PERIPHERY_DISABLE_TERMINALS: false
      PERIPHERY_DISABLE_CONTAINER_TERMINALS: false
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
      PERIPHERY_LOGGING_PRETTY: false
      PERIPHERY_PRETTY_STARTUP_CONFIG: false
    volumes:
      - "${DOCKER_SOCKET_PATH:?Set DOCKER_SOCKET_PATH}:/var/run/docker.sock"
      - komodo-keys:/config/keys
      - "${PERIPHERY_ROOT_DIRECTORY:?Set PERIPHERY_ROOT_DIRECTORY}:${PERIPHERY_ROOT_DIRECTORY:?Set PERIPHERY_ROOT_DIRECTORY}"

networks:
  default:
    name: portainer_network

volumes:
  # Keep the existing physical volumes when the Compose project becomes management.
  # Set MANAGEMENT_VOLUME_PREFIX to the old project name if it was not server.
  komodo-mongo-data:
    name: ${MANAGEMENT_VOLUME_PREFIX:-server}_komodo-mongo-data
  komodo-mongo-config:
    name: ${MANAGEMENT_VOLUME_PREFIX:-server}_komodo-mongo-config
  komodo-keys:
    name: ${MANAGEMENT_VOLUME_PREFIX:-server}_komodo-keys
  komodo-bootstrap-config:
